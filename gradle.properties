org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 ships its own Kotlin support (KGP 2.2.x); this project stays on the standalone Kotlin
# plugin so the compiler version keeps matching the Compose/serialization plugins.
# The new DSL only works with built-in Kotlin, so it is turned off as well. Both flags are
# deprecated and disappear in AGP 10, which is when the built-in Kotlin migration has to happen.
android.builtInKotlin=false
android.newDsl=false
